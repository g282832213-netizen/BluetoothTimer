name: Build and test Shizuku APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'shizuku/**'
      - '.github/workflows/main.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare project
        run: |
          unzip -q BluetoothTimer-AndroidStudio-Project-v2.zip -d source
          python3 shizuku/prepare.py
      - name: Build and lint
        working-directory: source/BluetoothTimer
        run: gradle assembleDebug lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothTimer-Shizuku-APK
          path: source/BluetoothTimer/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          working-directory: source/BluetoothTimer
          script: gradle connectedDebugAndroidTest
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Verification-reports
          path: |
            source/BluetoothTimer/app/build/reports/
            source/BluetoothTimer/app/build/outputs/androidTest-results/
