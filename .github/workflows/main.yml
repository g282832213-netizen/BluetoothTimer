
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BluetoothTimer-AndroidStudio-Project-v2.zip'
      - 'ui-fix/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: unzip -q BluetoothTimer-AndroidStudio-Project-v2.zip -d source
      - name: Apply UI and Bluetooth fixes
        run: |
          cp ui-fix/MainActivity.kt source/BluetoothTimer/app/src/main/java/com/example/bluetoothtimer/MainActivity.kt
          cp ui-fix/BluetoothAccessibilityService.kt source/BluetoothTimer/app/src/main/java/com/example/bluetoothtimer/BluetoothAccessibilityService.kt
      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/BluetoothTimer/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """, 1)
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: source/BluetoothTimer
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothTimer-APK
          path: source/BluetoothTimer/app/build/outputs/apk/debug/app-debug.apk
