
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BluetoothTimer-AndroidStudio-Project-v2.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q BluetoothTimer-AndroidStudio-Project-v2.zip -d source

      - name: Build APK
        working-directory: source/BluetoothTimer
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothTimer-APK
          path: source/BluetoothTimer/app/build/outputs/apk/debug/app-debug.apk
